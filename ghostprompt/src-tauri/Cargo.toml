[package]
name = "ghostprompt"
version = "0.1.0"
description = "AI实时字幕与面试辅助工具"
authors = ["GhostPrompt"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "global-shortcut", "global-shortcut-all", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
cpal = "0.15"
anyhow = "1.0"
bytes = "1.5"
futures = "0.3"
ringbuf = "0.3"
webrtc-vad = "0.4"
dirs = "5.0"
async-stream = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
